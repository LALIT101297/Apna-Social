<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Apna Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#e5e9f1;--accent:#5b5ce2;--danger:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:white;font-weight:650;cursor:pointer}
button.secondary{background:#eef0ff;color:#3435a6}button.danger{background:#fff0ef;color:var(--danger)}button:disabled{opacity:.5}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);margin:6px 0}
textarea{min-height:90px;resize:vertical}.muted{color:var(--muted)}.hidden{display:none!important}
header{position:sticky;top:0;background:#101827;color:white;padding:14px 16px;z-index:3;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:19px}.wrap{max-width:650px;margin:18px auto;padding:0 13px 90px}
.panel,.post,.profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #15203a08}
h2,h3,p{margin-top:0}h2{font-size:21px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}
.tabs button{background:transparent;color:#39445a;padding:9px 8px;font-size:13px}.tabs button.active{color:var(--accent);background:#f0f0ff}
.pill{display:inline-block;padding:4px 9px;background:#f0f0ff;color:#4546ad;border-radius:99px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:8px 11px;font-size:13px}
.posthead{display:flex;justify-content:space-between;gap:8px}.postcontent{white-space:pre-wrap;overflow-wrap:anywhere}
small{color:var(--muted)}a{color:var(--accent)}
@media(min-width:700px){.wrap{margin-top:28px}}
</style>
</head>
<body>
<header><strong>✦ Apna Social</strong><span id="headerUser" class="muted"></span></header>
<main class="wrap">
<section id="setupNotice" class="panel hidden"><h2>Connect your Supabase project</h2><p>Open <code>app.js</code> and add your Supabase Project URL and anon/publishable key.</p></section>
<section id="authView" class="panel">
<h2 id="authTitle">Create your account</h2>
<div id="signupFields">
<input id="fullName" placeholder="Full name">
<input id="username" placeholder="Username (e.g. lalit_123)">
</div>
<input id="email" type="email" autocomplete="email" placeholder="Email address">
<input id="password" type="password" autocomplete="current-password" placeholder="Password (min. 8 characters)">
<button id="authButton" style="width:100%">Sign up</button>
<div class="row" style="margin-top:10px"><button id="switchAuth" class="secondary">Already have an account? Login</button><button id="forgot" class="secondary">Forgot password</button></div>
<p id="authMessage" class="muted"></p>
</section>
<section id="appView" class="hidden">
<div id="feedPage"><div class="panel"><h2>Following</h2><p class="muted">Latest posts from people you follow.</p><textarea id="postText" maxlength="2000" placeholder="Write a post..."></textarea><button id="publish">Publish post</button></div><div id="feed"></div></div>
<div id="searchPage" class="hidden"><div class="panel"><h2>Find people</h2><input id="searchInput" placeholder="Search username or name"><div id="searchResults"></div></div></div>
<div id="profilePage" class="hidden"><div id="myProfile" class="panel"></div><div class="panel"><h3>Edit profile</h3><input id="editName" placeholder="Full name"><input id="editGotra" placeholder="Gotra (optional)"><input id="editBio" placeholder="Bio"><button id="saveProfile">Save profile</button></div><div id="myPosts"></div></div>
<div id="adminPage" class="hidden"><div class="panel"><h2>Staff dashboard</h2><p class="muted">Reports and moderation tools for authorized staff.</p><div id="adminReports"></div></div></div>
</section>
</main>
<nav id="tabs" class="tabs hidden">
<button data-page="feedPage" class="active">⌂<br>Home</button><button data-page="searchPage">⌕<br>Explore</button><button data-page="profilePage">◉<br>Profile</button><button data-page="adminPage" id="adminTab" class="hidden">♛<br>Staff</button><button id="logout">↪<br>Logout</button>
</nav>
<script src="./app.js"></script>
</body></html>
